name = "save-station-drive"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Plain values — safe to commit. The client SECRET is not here; it goes in via
# `wrangler secret put GOOGLE_CLIENT_SECRET` (see README).
[vars]
GOOGLE_CLIENT_ID = "1043116488819-uehkbdpe89r2032gim7kqigpv3e7mk6j.apps.googleusercontent.com"
FIREBASE_PROJECT_ID = "save-station-fd3a9"
SITE_URL = "https://jacobwood2004.github.io/Save-Station-Site/"
SITE_ORIGIN = "https://jacobwood2004.github.io"
# Set this to the Worker's own URL after the first deploy tells you what it is.
WORKER_ORIGIN = "https://save-station-drive.YOUR-SUBDOMAIN.workers.dev"

# Holds one Google refresh token per user, keyed by Firebase uid, plus
# short-lived link states. Create it with:
#   wrangler kv namespace create TOKENS
# then paste the id it prints below.
[[kv_namespaces]]
binding = "TOKENS"
id = "PASTE_KV_NAMESPACE_ID"
