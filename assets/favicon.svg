<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Save Station">
  <title>Save Station</title>
  <!--
    The 16px cut of the logo. The full mark (assets/logo.svg) turns to mush in a
    browser tab, so this keeps only what still reads that small: the floppy, the
    ring, and five dots where the devices sit — teal one at the top for the cloud.
  -->
  <defs>
    <linearGradient id="fvFloppy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a80ff"/>
      <stop offset="1" stop-color="#5b8cff"/>
    </linearGradient>
    <linearGradient id="fvTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2330"/>
      <stop offset="1" stop-color="#0e1420"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#fvTile)"/>
  <circle cx="32" cy="32" r="24" fill="none" stroke="#7c5cff" stroke-width="2" opacity=".45"/>

  <!-- the devices, reduced to where they sit -->
  <circle cx="32" cy="8"    r="5.2" fill="#4ad2c9"/>
  <circle cx="54.8" cy="24.6" r="4.4" fill="#c8d3e2"/>
  <circle cx="46.1" cy="51.4" r="4.4" fill="#c8d3e2"/>
  <circle cx="17.9" cy="51.4" r="4.4" fill="#c8d3e2"/>
  <circle cx="9.2" cy="24.6"  r="4.4" fill="#c8d3e2"/>

  <!-- floppy -->
  <path d="M22.6 18.8h16.6l6 6V42a3.2 3.2 0 0 1-3.2 3.2H22.6A3.2 3.2 0 0 1 19.4 42V22a3.2 3.2 0 0 1 3.2-3.2Z" fill="url(#fvFloppy)"/>
  <path d="M27.2 18.8h9.2v8.8a1.2 1.2 0 0 1-1.2 1.2h-6.8a1.2 1.2 0 0 1-1.2-1.2Z" fill="#e9eefc"/>
  <rect x="24.2" y="33.4" width="15.6" height="9.6" rx="1.6" fill="#f2f5ff"/>
  <path d="M26.8 37.4h10.4" stroke="#a99bff" stroke-width="2" stroke-linecap="round"/>
</svg>
